version: 2

# Policy: pinned by default, moved only when there is a security reason.
#
# Chasing latest for its own sake is not a security posture - it is churn that widens the
# window for a compromised release to be adopted. But a pin frozen forever keeps every CVE
# later found in it, which this repository demonstrated on its first pipeline run
# (path-to-regexp 0.1.12, CVE-2026-4867, HIGH). So the two are separated:
#
#   pin        for artifact integrity - a SHA cannot be repointed, a tag can
#   update     only on an advisory, or where nothing else is watching
#
# Dependabot has no write access to main. Everything it opens goes through the same PR gate
# as a human change and nothing auto-merges: it proposes, it does not update.

updates:
  # ---------------------------------------------------------------------------------
  # npm - SECURITY UPDATES ONLY.
  #
  # open-pull-requests-limit: 0 disables version updates while leaving Dependabot security
  # updates (a repository-level setting) unaffected, since those are not subject to this
  # limit. So no PR arrives for "a newer express exists", but one arrives immediately for
  # "the pinned express has an advisory".
  #
  # Deliberately not using `ignore` to achieve this: ignore rules can also suppress
  # security updates, which would silence the exact thing worth hearing about.
  #
  # Dependency CVEs are gated independently by Trivy fs and npm audit in PR validation, so
  # a vulnerable package cannot merge whether or not Dependabot noticed first.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0
    commit-message:
      prefix: "fix(deps)"
      prefix-development: "chore(deps)"
    # Inert while version updates are disabled above - cooldown does not apply to security
    # updates, which should arrive immediately. It is declared anyway so that re-enabling
    # version updates cannot accidentally do so without a cooldown in place.
    cooldown:
      default-days: 7

  # ---------------------------------------------------------------------------------
  # Docker base image - SECURITY UPDATES ONLY, same reasoning.
  #
  # Node 22 is LTS-supported into 2027, so there is no reason to be dragged onto 26. Base
  # image CVEs are caught by the Trivy image scan, which gates on HIGH/CRITICAL before the
  # push - that is the control here, not a version bump.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0
    commit-message:
      prefix: "fix(docker)"
    # Inert while version updates are disabled above - cooldown does not apply to security
    # updates, which should arrive immediately. It is declared anyway so that re-enabling
    # version updates cannot accidentally do so without a cooldown in place.
    cooldown:
      default-days: 7

  # ---------------------------------------------------------------------------------
  # GitHub Actions - VERSION UPDATES ON. The one ecosystem that needs them.
  #
  # Nothing else watches these. Trivy does not scan action versions, so a pinned action
  # with a known problem would drift silently forever. Since the whole point of pinning
  # actions by SHA is that a tag can be repointed at malicious code, those pins have to be
  # advanced deliberately by something.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    # One PR for all of them rather than one per action. Five near-identical PRs is noise,
    # and noise is what gets rubber-stamped.
    groups:
      actions:
        patterns: ["*"]
    # Do not adopt a release the day it ships. Compromised releases are typically caught
    # and yanked within days, and a bot that upgrades instantly is the fastest path from
    # someone else's stolen publish token into our pipeline.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci(deps)"
