name: PR Validation

# Every change reaching main must pass through here first. main is protected and
# requires the aggregate "PR gate" check below, so these scans are not advisory.
on:
  pull_request:
    branches: [main]
  # Lets us exercise the pipeline from a branch without opening throwaway PRs.
  workflow_dispatch:

# Pushing a new commit to a PR makes the in-flight run obsolete. Cancelling it keeps
# feedback fast and avoids burning runner minutes on results nobody will read.
concurrency:
  group: pr-validation-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# Default to read-only and elevate per job. A compromised action in the SAST job
# should not be able to push code or publish packages.
permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # Gitleaks scans commit history, not just the working tree: a secret that was
          # committed and then "removed" in a later commit is still leaked.
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Fail the job on any finding. There is no acceptable number of committed secrets.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "true"

  sast:
    name: SAST
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # Required to publish findings to the repository's Security > Code scanning tab.
      security-events: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # Semgrep is installed via pipx rather than run as a `container:` job. The official
      # image is Alpine/musl based, and GitHub's JavaScript actions (upload-sarif) inject a
      # glibc node binary that cannot execute there.
      - name: Install Semgrep
        run: pipx install semgrep

      - name: Scan
        # One scan produces the SARIF used for BOTH reporting and gating, so the gate can
        # never disagree with what reviewers see in the Security tab.
        # --metrics=off keeps source code and findings off Semgrep's telemetry endpoint.
        run: |
          semgrep scan \
            --config=p/javascript \
            --config=p/nodejs \
            --config=p/owasp-top-ten \
            --config=p/secrets \
            --sarif --output=semgrep.sarif \
            --metrics=off \
            --no-error
        # --no-error: never fail here. Gating is a separate, explicit step below so that
        # findings always get uploaded even when the gate is going to fail.

      - name: Upload findings to code scanning
        uses: github/codeql-action/upload-sarif@c4dd10e44af883a891fe31ced449bcb4a6728b9b # v3
        # Upload even on a failing gate, but only if the scan got far enough to write a
        # report - otherwise a failed build adds a misleading "path does not exist" error.
        if: always() && hashFiles('semgrep.sarif') != ''
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      - name: Gate on critical findings
        # The task requires failing on critical vulnerabilities. Semgrep maps its ERROR
        # severity to SARIF level "error"; WARNING/INFO map to warning/note and are
        # reported for triage without blocking the PR.
        run: |
          count=$(jq '[.runs[].results[] | select(.level == "error")] | length' semgrep.sarif)
          echo "ERROR-severity findings: $count"
          if [ "$count" -gt 0 ]; then
            jq -r '.runs[].results[] | select(.level == "error")
              | "::error file=\(.locations[0].physicalLocation.artifactLocation.uri),line=\(.locations[0].physicalLocation.region.startLine)::\(.message.text)"' \
              semgrep.sarif
            echo "Blocking: $count critical SAST finding(s). See Security > Code scanning."
            exit 1
          fi

  dependency-scan:
    name: Dependency scan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # Same report-then-gate split as the SAST job. It is also the safe pattern here:
      # trivy-action does not reliably honour exit-code while rendering the SARIF
      # template, so a scan that both reports and gates can silently pass.
      - name: Trivy filesystem scan (report)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          format: sarif
          output: trivy-fs.sarif
          # No severity filter: the Security tab should show the full picture, including
          # the unfixed and low-severity findings the gate below deliberately tolerates.

      - name: Upload findings to code scanning
        uses: github/codeql-action/upload-sarif@c4dd10e44af883a891fe31ced449bcb4a6728b9b # v3
        # Upload even on a failing gate, but only if the scan got far enough to write a
        # report - otherwise a failed build adds a misleading "path does not exist" error.
        if: always() && hashFiles('trivy-fs.sarif') != ''
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

      - name: Gate on high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          # A CVE with no released fix cannot be actioned by bumping a dependency, so
          # blocking on it would only teach people to bypass the gate. Still reported above.
          ignore-unfixed: true
          exit-code: "1"
          format: table
        env:
          # The vulnerability DB is already in the action's cache from the report step,
          # so this second pass costs seconds rather than another download.
          TRIVY_SKIP_DB_UPDATE: "true"
          TRIVY_SKIP_JAVA_DB_UPDATE: "true"

      - name: npm audit
        # Second opinion from a different vulnerability database. Trivy and the npm advisory
        # database do not always agree, and disagreement is itself useful signal.
        if: always()
        run: npm audit --audit-level=high

  image:
    name: Image build, smoke test and scan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5 # v3.3.0
        with:
          dockerfile: Dockerfile
          # Advisory rather than blocking: hadolint's style rules are opinionated, and a
          # failing lint should not be indistinguishable from a critical CVE.
          failure-threshold: error

      # The default docker driver cannot export a build cache. This sets up the
      # docker-container driver, which supports both `cache-to: type=gha` and loading the
      # result into the local daemon so the smoke test can run it.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build image
        # Deliberately built and NOT pushed. Nothing reaches a registry from a pull
        # request; the release workflow on main is the only thing that publishes.
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: false
          load: true
          tags: sample-nodejs:pr-${{ github.event.pull_request.number || github.run_id }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the built image
        # `docker build` succeeds even when the app is broken, because building never runs
        # it. Without this, a broken app produces a clean scan, a successful push and a
        # CrashLoopBackOff in the cluster with every pipeline step green.
        #
        # Asserts exactly what the Helm chart depends on: the two probe endpoints, the
        # Ingress path, and the metrics scrape target.
        env:
          IMAGE: sample-nodejs:pr-${{ github.event.pull_request.number || github.run_id }}
        run: |
          set -euo pipefail
          docker run -d --name smoke -p 8099:8080 "$IMAGE"
          trap 'docker logs smoke || true; docker rm -f smoke >/dev/null 2>&1 || true' EXIT

          # --retry-all-errors covers the startup race without guessing a sleep duration.
          curl -fsS --retry 30 --retry-delay 1 --retry-all-errors -o /dev/null \
            http://127.0.0.1:8099/live
          echo "livenessProbe target  /live   OK"

          curl -fsS -o /dev/null http://127.0.0.1:8099/ready
          echo "readinessProbe target /ready  OK"

          body=$(curl -fsS http://127.0.0.1:8099/my-app)
          test "$body" = "Hello, World!" || { echo "::error::/my-app returned '$body'"; exit 1; }
          echo "Ingress main path     /my-app OK"

          curl -fsS http://127.0.0.1:8099/metrics | grep -q '^root_access_total '
          echo "metrics scrape target /metrics OK"

          # Regression guard for the tini/PID-1 fix: without an init process at PID 1,
          # node discards SIGTERM and this takes the full 10s timeout before SIGKILL.
          start=$(date +%s)
          docker stop smoke >/dev/null
          elapsed=$(( $(date +%s) - start ))
          echo "container stopped in ${elapsed}s"
          test "$elapsed" -lt 5 || {
            echo "::error::SIGTERM not honoured (${elapsed}s) - init process at PID 1 is missing"
            exit 1
          }

      - name: Trivy image scan (report)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: sample-nodejs:pr-${{ github.event.pull_request.number || github.run_id }}
          format: sarif
          output: trivy-image.sarif

      - name: Upload findings to code scanning
        uses: github/codeql-action/upload-sarif@c4dd10e44af883a891fe31ced449bcb4a6728b9b # v3
        # Upload even on a failing gate, but only if the scan got far enough to write a
        # report - otherwise a failed build adds a misleading "path does not exist" error.
        if: always() && hashFiles('trivy-image.sarif') != ''
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

      - name: Gate on high and critical image vulnerabilities
        # The brief requires blocking deployment on high-severity image findings. Gating
        # here, before the release workflow can ever push, means a vulnerable image is
        # never published rather than published and then flagged.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: sample-nodejs:pr-${{ github.event.pull_request.number || github.run_id }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
        env:
          TRIVY_SKIP_DB_UPDATE: "true"
          TRIVY_SKIP_JAVA_DB_UPDATE: "true"

  chart:
    name: Chart lint and validate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    env:
      CHART: charts/sample-nodejs
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: helm lint
        # --strict promotes lint warnings to errors. Also exercises values.schema.json,
        # which is where a typo like `replicaCount: "two"` gets caught.
        run: helm lint "$CHART" --strict

      - name: Render manifests
        # Rendered twice: once with defaults, once with every optional feature on. The
        # optional templates (NetworkPolicy, ServiceMonitor, Secret) are off by default, so
        # a syntax error in them would otherwise never be exercised by CI.
        run: |
          helm template rel "$CHART" > rendered-default.yaml
          helm template rel "$CHART" \
            --set networkPolicy.enabled=true \
            --set metrics.serviceMonitor.enabled=true \
            --set secretEnv.EXAMPLE=value \
            > rendered-all.yaml
          echo "default: $(grep -c '^kind:' rendered-default.yaml) objects"
          echo "all-on:  $(grep -c '^kind:' rendered-all.yaml) objects"

      - name: Validate against Kubernetes API schemas
        # helm lint checks templating; it does not check that the output is a valid
        # Kubernetes object. kubeconform validates against the real OpenAPI schemas, which
        # catches a misspelled field the API server would reject at apply time.
        run: |
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz" \
            | tar -xz kubeconform
          ./kubeconform -strict -summary \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            rendered-default.yaml rendered-all.yaml

      - name: Install Checkov
        run: pipx install checkov

      - name: Checkov (advisory)
        # Advisory, not gating. Checkov's OSS checks carry no severity, and it applies
        # Deployment rules to any Pod - it demands readiness and liveness probes on the
        # one-shot `helm test` pod, which is meaningless. Gating on that would either block
        # legitimate work or push people to bulk-skip checks, which is worse than triaging
        # a report. Genuine findings from it were fixed rather than suppressed.
        run: checkov -d "$CHART" --framework helm --compact --quiet --soft-fail -o sarif --output-file-path .

      - name: Upload Checkov findings to code scanning
        uses: github/codeql-action/upload-sarif@c4dd10e44af883a891fe31ced449bcb4a6728b9b # v3
        if: always() && hashFiles('results.sarif') != ''
        with:
          sarif_file: results.sarif
          category: checkov

  pr-gate:
    name: PR gate
    # Single aggregate check to require in branch protection. Adding a new scan job only
    # needs a `needs:` entry here rather than a settings change.
    if: always()
    needs: [secret-scan, sast, dependency-scan, image, chart]
    runs-on: ubuntu-24.04
    steps:
      - name: Verify all validation jobs succeeded
        run: |
          echo '${{ toJSON(needs) }}' | jq -r 'to_entries[] | "\(.value.result)\t\(.key)"'
          echo '${{ toJSON(needs) }}' | jq -e 'all(.[]; .result == "success")' > /dev/null \
            || { echo "::error::One or more validation jobs did not succeed - blocking merge."; exit 1; }
          echo "All validation jobs passed."
