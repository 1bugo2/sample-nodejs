name: Release

# Runs only after a PR has merged into protected main, so everything here has already
# passed the PR gate (secrets, SAST, dependencies, image build + smoke test + scan,
# chart lint). This workflow publishes; it does not re-litigate whether the change is safe.
on:
  push:
    branches: [main]
    # A deny-list, not an allow-list, and that choice is deliberate. With `paths:` you
    # enumerate what triggers a release, so a new file you forget to list means a real
    # change ships nothing and nobody notices. With `paths-ignore:` the worst case is one
    # unnecessary release. For a release gate, failing towards "published something
    # redundant" is far safer than failing towards "silently published nothing".
    #
    # charts/** is deliberately NOT ignored: the chart lives in this repo, so a change to a
    # probe timing or a resource limit needs a new chart version published even though it
    # does not alter the image.
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
      - ".github/pull_request_template.md"
  workflow_dispatch:

# Never cancel a release mid-flight. Cancelling between "image pushed" and "digest
# promoted" would leave the registry and the GitOps repo disagreeing about what is current.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  CHART_PATH: charts/sample-nodejs
  GITOPS_REPO: 1bugo2/sample-nodejs-gitops

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      # Create the tag and the GitHub Release.
      contents: write
      # Push the image and the chart to GHCR.
      packages: write
      # Cosign keyless signing exchanges this OIDC token for a certificate, which is what
      # removes the need for a long-lived signing key stored as a secret.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history and tags: the version bump is derived from the commits since the
          # last tag, so a shallow clone would compute the wrong bump.
          fetch-depth: 0

      - name: Derive version from Conventional Commits
        id: version
        # Git tags are the source of truth for the released version, not package.json -
        # that belongs to the upstream fixture and is not ours to bump.
        run: |
          set -euo pipefail
          git fetch --tags --force --quiet
          last=$(git tag -l 'v*' --sort=-v:refname | head -n1 || true)

          if [ -z "$last" ]; then
            version="1.0.0"; bump="initial"
          else
            log=$(git log --format='%s%n%b' "${last}..HEAD")
            # A "!" after the type, or a BREAKING CHANGE trailer, means major.
            if printf '%s\n' "$log" | grep -qE '^BREAKING[ -]CHANGE' \
               || printf '%s\n' "$log" | grep -qE '^[a-z]+(\([^)]*\))?!:'; then
              bump=major
            elif printf '%s\n' "$log" | grep -qE '^feat(\([^)]*\))?:'; then
              bump=minor
            else
              # Anything else is a patch. Docs-only merges never reach this workflow at
              # all - see paths-ignore above - so a version bump here always corresponds to
              # a change in something deployable.
              bump=patch
            fi
            v=${last#v}
            major=${v%%.*}; rest=${v#*.}; minor=${rest%%.*}; patch=${rest#*.}
            case "$bump" in
              major) major=$((major+1)); minor=0; patch=0 ;;
              minor) minor=$((minor+1)); patch=0 ;;
              patch) patch=$((patch+1)) ;;
            esac
            version="${major}.${minor}.${patch}"
          fi

          echo "previous=${last:-none}" >> "$GITHUB_OUTPUT"
          echo "bump=$bump"            >> "$GITHUB_OUTPUT"
          echo "version=$version"      >> "$GITHUB_OUTPUT"
          {
            echo "### Release \`v$version\`"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| previous tag | \`${last:-none}\` |"
            echo "| bump | \`$bump\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # The built-in token is enough for GHCR with packages: write - no PAT needed.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        # Loaded into the local daemon, NOT pushed. The scan below has to pass first, and
        # pushing afterwards from the same local image guarantees the bits that were
        # scanned are exactly the bits that get published.
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          load: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:v${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:v${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          docker run -d --name smoke -p 8099:8080 "$IMAGE"
          trap 'docker logs smoke || true; docker rm -f smoke >/dev/null 2>&1 || true' EXIT
          curl -fsS --retry 30 --retry-delay 1 --retry-all-errors -o /dev/null http://127.0.0.1:8099/live
          curl -fsS -o /dev/null http://127.0.0.1:8099/ready
          test "$(curl -fsS http://127.0.0.1:8099/my-app)" = "Hello, World!"
          curl -fsS http://127.0.0.1:8099/metrics | grep -q '^root_access_total '
          echo "endpoints the chart depends on all respond"

      - name: Block release on high or critical vulnerabilities
        # The gate that matters. It runs BEFORE the push, so a vulnerable image is never
        # published rather than published and then reported.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:v${{ steps.version.outputs.version }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Push image
        id: push
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          VERSION: v${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          docker push "$IMAGE:$VERSION"
          docker push "$IMAGE:sha-${{ github.sha }}"
          # The digest is the deployable identity. Everything downstream - signing, the
          # SBOM, and the GitOps promotion - refers to this rather than to a tag.
          digest=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE:$VERSION" | cut -d'@' -f2)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "pushed $IMAGE@$digest"

      - name: Install cosign and syft
        run: |
          set -euo pipefail
          sudo curl -fsSL -o /usr/local/bin/cosign \
            https://github.com/sigstore/cosign/releases/download/v2.4.3/cosign-linux-amd64
          sudo chmod +x /usr/local/bin/cosign
          curl -fsSL -o syft.tar.gz \
            https://github.com/anchore/syft/releases/download/v1.19.0/syft_1.19.0_linux_amd64.tar.gz
          tar -xzf syft.tar.gz syft && sudo mv syft /usr/local/bin/ && rm syft.tar.gz
          cosign version --json >/dev/null && echo "cosign ok"
          syft version | head -1

      - name: Generate SBOM
        env:
          REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}
        run: |
          # By digest, so the SBOM describes the exact artifact that was pushed.
          syft "$REF" -o spdx-json=sbom.spdx.json -q
          echo "SBOM packages: $(jq '.packages | length' sbom.spdx.json)"

      - name: Sign image and attest the SBOM
        env:
          REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail

          # Keyless signing depends on two public Sigstore services - Fulcio for the
          # short-lived certificate and Rekor for the transparency log. That puts an
          # external dependency in the release path, and a release once failed here on
          # "connection reset by peer" from fulcio.sigstore.dev with nothing wrong on our
          # side. Retry with backoff so a network blip does not fail an otherwise good
          # release.
          #
          # Still blocking rather than best-effort: a release that claims to be signed
          # should be signed. Retrying makes it resilient, not optional.
          retry() {
            local attempt=1 max=4 delay=15
            until "$@"; do
              if [ "$attempt" -ge "$max" ]; then
                echo "::error::'$*' failed after $max attempts"
                return 1
              fi
              echo "attempt $attempt failed, retrying in ${delay}s"
              sleep "$delay"
              attempt=$((attempt + 1))
              delay=$((delay * 2))
            done
          }

          retry cosign sign --yes "$REF"
          retry cosign attest --yes --predicate sbom.spdx.json --type spdxjson "$REF"

      - name: Package and push the Helm chart as an OCI artifact
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # Chart version and appVersion move together: the chart is versioned with the
          # application it deploys, and both are released from this commit.
          helm package "$CHART_PATH" --version "$VERSION" --app-version "$VERSION" -d dist/
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | helm registry login "$REGISTRY" -u "${{ github.actor }}" --password-stdin
          helm push "dist/sample-nodejs-${VERSION}.tgz" "oci://${REGISTRY}/${{ github.repository_owner }}/charts"

      - name: Tag and create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          DIGEST: ${{ steps.push.outputs.digest }}
          PREVIOUS: ${{ steps.version.outputs.previous }}
        run: |
          set -euo pipefail

          # An annotated tag records who and when, but git refuses to write one without an
          # identity and the runner has none configured by default. Set per-command rather
          # than globally so it cannot leak into any other step.
          git -c user.name='sample-nodejs release' \
              -c user.email='noamya7312@gmail.com' \
              tag -a "v$VERSION" -m "Release v$VERSION (${DIGEST})"
          git push origin "v$VERSION"

          # --generate-notes builds the changelog from merged PRs, so Conventional Commit
          # subjects become the release notes without maintaining a CHANGELOG file.
          # --notes-start-tag is only valid once a previous tag exists.
          notes=(--generate-notes)
          if [ "$PREVIOUS" != "none" ]; then
            notes+=(--notes-start-tag "$PREVIOUS")
          fi
          gh release create "v$VERSION" --title "v$VERSION" "${notes[@]}" sbom.spdx.json

      - name: Promote to the GitOps repository
        env:
          DEPLOY_KEY: ${{ secrets.GITOPS_DEPLOY_KEY }}
          VERSION: ${{ steps.version.outputs.version }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          # A deploy key scoped to the GitOps repo alone. This is the pipeline's entire
          # deploy authority: it can write a version into one file in one repository. It
          # holds no kubeconfig and cannot reach the cluster, which is unroutable from here.
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null

          sudo curl -fsSL -o /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/download/v4.44.6/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

          git clone --depth 1 "git@github.com:${GITOPS_REPO}.git" gitops
          cd gitops

          # Both environments receive the SAME digest. This is a promotion, not a rebuild:
          # prod gets the identical artifact dev has been running, so what a human approves
          # in prod is the thing that was actually tested - not a fresh build that merely
          # came from the same commit.
          #
          # Writing prod's desired state here does not deploy it. The prod Application has
          # no `automated` sync policy, so it sits OutOfSync showing the diff until someone
          # syncs it. The gate lives in ArgoCD, which means CI needs no cluster credential
          # and no extra privilege in order for production to be gated at all.
          for env in dev prod; do
            values="envs/${env}/values.yaml"
            app="argocd/applications/sample-nodejs-${env}.yaml"

            DIGEST="$DIGEST"   yq -i '.image.digest = strenv(DIGEST)'      "$values"
            VERSION="$VERSION" yq -i '.image.tag = "v" + strenv(VERSION)'  "$values"

            # Advance the chart version too. Without this the image is promoted but the
            # chart is not, so a change to a probe or a resource limit would be published to
            # the registry and then never deployed - the pipeline would look green while the
            # cluster ignored it.
            # Selected by chart name because `sources` is a list and the second entry is the
            # values ref, which has no chart field.
            VERSION="$VERSION" yq -i \
              '(.spec.sources[] | select(.chart == "sample-nodejs") | .targetRevision) = strenv(VERSION)' \
              "$app"
          done

          if git diff --quiet; then
            echo "digest unchanged - nothing to promote"
            exit 0
          fi

          git -c user.name='sample-nodejs release' \
              -c user.email='noamya7312@gmail.com' \
              commit -am "deploy: sample-nodejs v${VERSION} (prod awaits manual sync)"
          git push
          echo "::notice::promoted v${VERSION} (${DIGEST}) - dev syncs automatically, prod awaits approval"

      - name: Summary
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo "| image | \`${REGISTRY}/${IMAGE_NAME}:v${VERSION}\` |"
            echo "| digest | \`${DIGEST}\` |"
            echo "| chart | \`oci://${REGISTRY}/${{ github.repository_owner }}/charts/sample-nodejs:${VERSION}\` |"
            echo "| signed | cosign keyless + SBOM attestation |"
            echo "| promoted to | \`${GITOPS_REPO}\` → ArgoCD |"
          } >> "$GITHUB_STEP_SUMMARY"
