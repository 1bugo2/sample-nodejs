apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "sample-nodejs.fullname" . }}
  labels:
    {{- include "sample-nodejs.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.config }}
  # Quoted because a ConfigMap value must be a string: an unquoted 8080 renders as an
  # integer and the API server rejects the object.
  {{ $key }}: {{ $value | quote }}
  {{- end }}
