{{- if .Values.secretEnv }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sample-nodejs.fullname" . }}
  labels:
    {{- include "sample-nodejs.labels" . | nindent 4 }}
type: Opaque
# stringData rather than data: Helm would otherwise require every value to be pre-encoded,
# and hand-base64'ing values in a values file is how people end up committing a secret
# they thought was encrypted. Base64 is not encryption either way.
stringData:
  {{- range $key, $value := .Values.secretEnv }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
