{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "sample-nodejs.serviceAccountName" . }}
  labels:
    {{- include "sample-nodejs.labels" . | nindent 4 }}
# A dedicated ServiceAccount rather than `default`, so any future RBAC applies to this
# workload alone. It is granted nothing, and the token is not mounted.
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}
