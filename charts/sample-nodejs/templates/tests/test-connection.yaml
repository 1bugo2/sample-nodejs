apiVersion: v1
kind: Pod
metadata:
  name: {{ include "sample-nodejs.fullname" . }}-test
  labels:
    {{- include "sample-nodejs.labels" . | nindent 4 }}
  annotations:
    # Run only on `helm test`, not on install. Deleted afterwards regardless of outcome,
    # so a failed run does not leave a stray Pod behind for someone to puzzle over.
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  # This pod has no reason to talk to the API server, and Checkov flagged the default
  # mount (CKV_K8S_38). A test pod is still a pod.
  automountServiceAccountToken: false
  # Same hardening as the app: a test pod running as root with a writable filesystem is a
  # gap in exactly the place nobody looks.
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: curl
      # Pinned by digest, not tag (CKV_K8S_43). Same reasoning as the application image:
      # a tag can be repointed at different content.
      image: curlimages/curl@sha256:c1fe1679c34d9784c1b0d1e5f62ac0a79fca01fb6377cdd33e90473c6f9f9a69
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          memory: 32Mi
      # Asserts the deployment contract through the Service, i.e. via the same path real
      # traffic takes, rather than by exec-ing into a pod. Verifies both probe endpoints,
      # the route the Ingress serves, and that /metrics is exposing the counter.
      command: ["/bin/sh", "-c"]
      args:
        - |
          set -eu
          BASE="http://{{ include "sample-nodejs.fullname" . }}:{{ .Values.service.port }}"

          echo "GET /live"
          curl -fsS "$BASE/live" | grep -qx 'Alive'

          echo "GET /ready"
          curl -fsS "$BASE/ready" | grep -qx 'Ready'

          echo "GET /my-app"
          curl -fsS "$BASE/my-app" | grep -qx 'Hello, World!'

          echo "GET /metrics exposes the counter"
          curl -fsS "$BASE/metrics" | grep -q '^root_access_total '

          echo "all checks passed"
